<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2RTK NTRIP server · 修改密码</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/theme.css">
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="auth-wrap">
    <section class="card auth-card fade-in">
      <div class="auth-brand">
        <i class="fa fa-lock" aria-hidden="true"></i>
        <span class="auth-title" data-i18n="pwd.title">修改管理员密码</span>
      </div>
      <p class="auth-sub" data-i18n="pwd.sub">修改后请使用新密码重新登录</p>

      {% if error_message %}
        <div class="alert alert-error">{{ error_message }}</div>
      {% endif %}

      {% if success_message %}
        <div class="alert alert-success">{{ success_message }}</div>
      {% endif %}

      <form method="POST" action="/change_password" class="form">
        <div class="field">
          <label class="form-label" for="old_password" data-i18n="pwd.old">当前密码</label>
          <input type="password" id="old_password" name="old_password" required
                 autocomplete="current-password" class="form-input">
        </div>

        <div class="field">
          <label class="form-label" for="new_password" data-i18n="pwd.new">新密码</label>
          <input type="password" id="new_password" name="new_password" required
                 autocomplete="new-password" class="form-input">
        </div>

        <div class="form-actions form-actions--start">
          <button type="submit" class="btn btn-primary" data-i18n="pwd.submit">保存新密码</button>
          <a href="/config" class="btn btn-secondary" data-i18n="pwd.cancel">取消</a>
        </div>
      </form>

      <button type="button" id="lang-toggle" class="btn btn-secondary btn-block mt-20" aria-label="Switch language">EN</button>
    </section>
  </main>

  <footer class="site-footer">
    <div class="page">
      <span data-i18n="footer.name">2RTK NTRIP server</span>
      <span>·</span>
      <span>&copy; <span id="year">2025</span></span>
    </div>
  </footer>

  <script src="/static/i18n.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
