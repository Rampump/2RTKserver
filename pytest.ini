[pytest]
# 只从 tests/ 收集用例。
#
# 不写这一行时 pytest 会从仓库根目录递归发现 `test_*.py` / `*_test.py`，
# 而现场排查时留在根目录的 `.probe_*.py`（含真实串口与凭据，已被 .gitignore
# 排除）名字里带 test，会被一并收集并在 import 阶段直接报错中断整轮测试
# —— 于是"本机能跑过"和"clone 下来能跑过"变成两件事。
# 显式钉死 testpaths，契约测试的结果就只取决于仓库内容。
testpaths = tests

# 屏蔽上面那类点号临时脚本，双保险（防止有人用 `pytest .` 直接指定根目录）。
norecursedirs = .* __pycache__ node_modules .venv venv .upgrade

python_files = test_*.py
